<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Сканер заказа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="zxing_reader.js?v=4"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #fff); --fg: var(--tg-theme-text-color, #111); --hint: var(--tg-theme-hint-color, #888);
          --btn: var(--tg-theme-button-color, #2481cc); --btn-fg: var(--tg-theme-button-text-color, #fff); --sec: var(--tg-theme-secondary-bg-color, #f2f2f2); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  #reader { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 220px; }
  video { display: block; width: 100%; }
  #frame { position: absolute; left: 5%; right: 5%; top: 30%; height: 40%; border: 2px solid #4caf50; border-radius: 8px; pointer-events: none; }
  #msg { margin: 12px 0; min-height: 22px; color: var(--hint); text-align: center; }
  #msg.err { color: #d33; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px; font-size: 16px; border: 0; border-radius: 10px; background: var(--sec); color: var(--fg); }
  button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-fg); }
</style>
</head>
<body>
<div id="reader"><video id="v" playsinline muted autoplay></video><div id="frame"></div></div>
<div id="msg">Наведите камеру на верхний штрихкод наклейки Kaspi</div>
<form id="f">
  <input id="num" inputmode="text" autocomplete="off" placeholder="или введите номер заказа">
  <button type="submit">Найти</button>
</form>
<div id="ver" style="margin-top:12px;text-align:center;font-size:12px;color:var(--hint)">версия 5</div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const msg = (t, err) => { const m = document.getElementById("msg"); m.textContent = t; m.className = err ? "err" : ""; };

// Номер заказа из кода: Kaspi — 6–12 цифр или как на наклейке (1 142 251 878-1-R-1), Intertop — I-42647317.
function parse(text) {
  const t = String(text || "").replace(/\s+/g, "");
  const label = t.match(/^(\d{6,12})-?\d-?[RrКк]-?\d+$/);
  if (label) return label[1];
  if (/^\d{6,12}$/.test(t)) return t;
  if (/^[IiИи]-?\d{5,}$/.test(t)) return t;
  return null;
}

let sent = false, stream = null;
function send(num) {
  if (sent) return;
  // кнопка внизу чата не даёт initData — проверяем только, что страница открыта внутри Telegram
  if (!tg || !tg.sendData || tg.platform === "unknown") { msg("Откройте сканер кнопкой «📷 Сканировать» в боте", true); return; }
  sent = true;
  try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  // из кнопки внизу чата initData пустой — sendData; из кнопки под сообщением (панель KASPI) sendData не работает — номер уходит ссылкой /start ord_<номер>
  const bot = new URLSearchParams(location.search).get("bot");
  if (tg.initData && bot) {
    tg.openTelegramLink("https://t.me/" + encodeURIComponent(bot) + "?start=ord_" + num.replace(/[^A-Za-z0-9_-]/g, ""));
    setTimeout(() => tg.close(), 300);
  } else tg.sendData(num);
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = document.getElementById("num").value;
  const n = parse(v);
  n ? send(n) : msg("Номер заказа — 6–12 цифр (Kaspi) или I-… (Intertop)", true);
});

let lastBad = "";
const video = document.getElementById("v"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
const OPTS = { formats: ["Code128", "QRCode", "EAN13", "ITF", "Code39"], tryHarder: true, maxNumberOfSymbols: 1 };

// распознаватель (zxing-wasm 3.1.5) лежит рядом со страницей, не на CDN
let ready = false, frames = 0, lastErr = "";
const ver = t => document.getElementById("ver").textContent = "версия 5 · " + t;
ZXingWASM.prepareZXingModule({
  overrides: { locateFile: (path, prefix) => path.endsWith(".wasm") ? new URL("zxing_reader.wasm?v=4", location.href).href : prefix + path },
  fireImmediately: true,
}).then(() => { ready = true; ver("распознаватель готов"); }, e => { msg("Распознаватель не загрузился: " + e, true); ver("ошибка загрузки"); });

async function tick() {
  if (sent) return;
  if (!ready) { setTimeout(tick, 200); return; }
  const w = video.videoWidth, h = video.videoHeight;
  if (w && h) {
    // середина кадра (рамка): 90% ширины, 40% высоты — так быстрее и не ловит соседние коды
    const sx = Math.floor(w * 0.05), sw = Math.floor(w * 0.9), sy = Math.floor(h * 0.3), sh = Math.floor(h * 0.4);
    canvas.width = sw; canvas.height = sh;
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
    try {
      const res = await ZXingWASM.readBarcodes(ctx.getImageData(0, 0, sw, sh), OPTS);
      const r = res.find(x => x.isValid && x.text);
      if (r) {
        const n = parse(r.text);
        if (n) { msg("Найдено: " + n); send(n); return; }
        if (r.text !== lastBad) { lastBad = r.text; msg("Это не номер заказа (" + r.text.slice(0, 40) + "). Наведите на верхний штрихкод", true); }
      }
      if (++frames % 10 === 0) ver("кадров: " + frames + " · " + w + "×" + h);
    } catch (e) { const t = String(e); if (t !== lastErr) { lastErr = t; msg("Ошибка распознавания: " + t.slice(0, 80), true); } }
  }
  setTimeout(tick, 120);
}

(async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    video.srcObject = stream;
    await video.play();
    msg("Наведите рамку на верхний штрихкод наклейки Kaspi");
    tick();
  } catch (e) {
    msg("Камера недоступна — разрешите доступ к камере или введите номер вручную", true);
  }
})();
</script>
</body>
</html>
